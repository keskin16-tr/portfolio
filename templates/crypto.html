{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fa-solid fa-coins me-2 text-warning"></i>Kripto Varlıklar</h2>
    <a href="/manage" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus me-1"></i>Varlık Ekle</a>
</div>

<div class="card p-4 mb-4">
    <div class="row text-center">
        <div class="col-md-4">
            <div class="text-muted small">Kripto Toplam Değer</div>
            <h4 class="fw-bold mt-1" id="cryptoTotal">- ₺</h4>
        </div>
        <div class="col-md-4">
            <div class="text-muted small">Toplam Maliyet</div>
            <h4 class="fw-bold mt-1" id="cryptoCost">- ₺</h4>
        </div>
        <div class="col-md-4">
            <div class="text-muted small">Kripto Kâr / Zarar</div>
            <h4 class="fw-bold mt-1" id="cryptoProfit">-</h4>
        </div>
    </div>
</div>

<div class="card p-4">
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>Varlık</th>
                    <th>Sembol</th>
                    <th>Bakiye</th>
                    <th>Birim Fiyat</th>
                    <th>Toplam Değer (₺)</th>
                    <th>Kâr / Zarar (₺)</th>
                </tr>
            </thead>
            <tbody id="cryptoTable">
                <tr><td colspan="6" class="text-center text-muted">Yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadCrypto() {
    const res = await fetch('/api/breakdown');
    const data = await res.json();
    const crypto = data.crypto;

    document.getElementById('cryptoTotal').innerText = crypto.value_try.toLocaleString('tr-TR', {style: 'currency', currency: 'TRY'});
    document.getElementById('cryptoCost').innerText = crypto.cost_try.toLocaleString('tr-TR', {style: 'currency', currency: 'TRY'});
    
    const profitEl = document.getElementById('cryptoProfit');
    profitEl.innerText = crypto.profit_try.toLocaleString('tr-TR', {style: 'currency', currency: 'TRY'}) + ` (%${crypto.profit_pct.toFixed(2)})`;
    profitEl.className = "fw-bold mt-1 " + (crypto.profit_try >= 0 ? "text-success" : "text-danger");

    const tbody = document.getElementById('cryptoTable');
    tbody.innerHTML = '';
    if(crypto.assets.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Kayıtlı kripto varlık bulunamadı.</td></tr>';
        return;
    }
    crypto.assets.forEach(a => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="fw-semibold">${a.name}</td>
            <td><code>${a.symbol || '-'}</code></td>
            <td>${a.quantity.toLocaleString('tr-TR')}</td>
            <td>${a.unit_price.toLocaleString('tr-TR')} ${a.currency}</td>
            <td>${a.value_try.toLocaleString('tr-TR', {style: 'currency', currency: 'TRY'})}</td>
            <td class="${a.profit_try >= 0 ? 'text-success' : 'text-danger'}">${a.profit_try.toLocaleString('tr-TR', {style: 'currency', currency: 'TRY'})} (%${a.profit_pct.toFixed(2)})</td>
        `;
        tbody.appendChild(tr);
    });
}
loadCrypto();
</script>
{% endblock %}
