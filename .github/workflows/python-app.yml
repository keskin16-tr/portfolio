name: Flask App Test Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Kodları Depodan Çek
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install flask
        pip install -r requirements.txt

    - name: Uygulamanın Hatasız Başlatılabildiğini Test Et
      run: |
        # Flask'ı arka planda başlat
        python app.py &
        
        # Sunucunun başlaması için 3 saniye ver
        sleep 3
        
        # Yerel olarak sunucuya istek atıp yanıt alabiliyor muyuz kontrol et
        curl --fail http://127.0.0.1:5000 || exit 1
