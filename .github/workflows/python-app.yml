# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask
        pip install ngrok
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
      - name: app.py ve Ngrok Çalıştır
      run: |
        # Flask uygulamasını arka planda başlat
        python app.py &
        
        # Ngrok kur ve dışarıya tünel aç (Ücretsiz bir ngrok token'ınız gerekebilir)
        pip install pyngrok
        python -c "from pyngrok import ngrok; public_url = ngrok.connect(5000); print('Public URL:', public_url)"
        
        # Action'ın hemen kapanmaması için bir süre uyutun veya test edin
        sleep 30
      
